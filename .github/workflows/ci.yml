name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit · Edge · Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secrets hygiene
        run: npm run check:secrets

      - name: Unit tests
        run: npm run test:unit

      - name: Edge (Deno) tests
        run: npm run test:edge

  integration:
    name: Integration (optional secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SKIP integration — add SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY repo secrets to enable."
            exit 0
          fi
          npm run test:integration

  e2e:
    name: Playwright (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Playwright smoke
        env:
          PLAYWRIGHT: ${{ secrets.PLAYWRIGHT }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ "$PLAYWRIGHT" != "1" ]; then
            echo "SKIP Playwright — set repo secret PLAYWRIGHT=1 and install browsers when ready."
            exit 0
          fi
          cd apps/manager && npx playwright install chromium --with-deps
          cd ../.. && PLAYWRIGHT=1 npm run test:e2e
